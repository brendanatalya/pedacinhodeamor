<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doces - Pedacinho de Amor</title>
    <link rel="stylesheet" href="css_pda/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css_pda/style_pda.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Pedacinho de Amor</h1>
        <nav>
            <ul>
                <li><a href="index.php">Home</a></li>
                <li><a href="sobrenos.html">Sobre Nós</a></li>
                <li><a href="doces.html" class="active">Doces</a></li>
                <li><a href="salgados.html">Salgados</a></li>
                <li><a href="personalizados.html">Personalizados</a></li>
                <li><a href="carrinho.html"><i class="fas fa-shopping-cart"></i> Carrinho (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <div id="toast" class="toast-notification"></div>

    <main>
        <section class="doces-hero" style="background-image:url('imagens/doce3.webp');">
            <div class="doces-hero__overlay"></div>
            <div class="doces-hero__content">
                <h1>DOCES</h1>
                <p>Deliciosamente feitos com carinho!</p>
            </div>
        </section>

        <div class="container">
            <div class="filter-buttons" id="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="bolos">Bolos</button>
                <button class="filter-btn" data-filter="brownie">Brownies e Mini Vulcões</button>
                <button class="filter-btn" data-filter="tortas">Tortas</button>
                <button class="filter-btn" data-filter="cones">Cones e Trufas</button>
                <button class="filter-btn" data-filter="outros">Outros</button>
            </div>

            <div id="products-container">
                <!-- Produtos serão inseridos aqui via JavaScript -->
            </div>
        </div>
    </main>

    <script>
        // Dados dos produtos - em um sistema real, isso viria de uma API ou banco de dados
        const products = [
            {
                id: 1,
                nome: "Mini Vulcão de Ninho com Nutella",
                descricao: "Delicioso mini vulcão recheado",
                preco: 30.00,
                imagem: "imagens/doce1.webp",
                disponivel: true,
                categoria: "brownie"
            },
            {
                id: 2,
                nome: "Brownie de Nutella",
                descricao: "Brownie macio com cobertura de nutella",
                preco: 15.00,
                imagem: "imagens/doce2.webp",
                disponivel: true,
                categoria: "brownie"
            },
            {
                id: 3,
                nome: "Cookie Recheado de Doce de Leite",
                descricao: "Cookie crocante por fora, cremoso por dentro",
                preco: 12.00,
                imagem: "imagens/doce1.webp",
                disponivel: false,
                categoria: "outros"
            },
            {
                id: 4,
                nome: "Camafeu",
                descricao: "Doce tradicional brasileiro",
                preco: 10.00,
                imagem: "imagens/doce3.webp",
                disponivel: true,
                categoria: "cones"
            },
            {
                id: 5,
                nome: "Torta de Frango com Cream Cheese",
                descricao: "Torta salgada leve e deliciosa",
                preco: 13.00,
                imagem: "imagens/doce3.webp",
                disponivel: true,
                categoria: "tortas"
            }
        ];

        // Função para obter o carrinho do localStorage
        function getCart() {
            return JSON.parse(localStorage.getItem('cart')) || {};
        }

        // Função para salvar o carrinho no localStorage
        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }

        // Função para atualizar a contagem do carrinho no header
        function updateCartCount() {
            const cart = getCart();
            const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
            document.getElementById('cart-count').textContent = count;
        }

        // Função para adicionar produto ao carrinho
        function addToCart(productId) {
            const cart = getCart();
            cart[productId] = (cart[productId] || 0) + 1;
            saveCart(cart);
            alert('Produto adicionado ao carrinho!');
        }

        // Função para renderizar produtos
        function renderProducts(filter = 'all') {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            const filteredProducts = filter === 'all' ? products : products.filter(p => p.categoria === filter);

            filteredProducts.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = `product-card ${!product.disponivel ? 'unavailable' : ''}`;

                productCard.innerHTML = `
                    <img src="${product.imagem}" alt="${product.nome}">
                    <div class="product-info">
                        <h3>${product.nome}</h3>
                        <p>${product.descricao}</p>
                        <div class="product-price">R$ ${product.preco.toFixed(2).replace('.', ',')}</div>
                        ${!product.disponivel ? '<div class="unavailable-badge">Indisponível</div>' : ''}
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})" ${!product.disponivel ? 'disabled' : ''}>
                            <i class="fas fa-shopping-cart"></i> Adicionar ao Carrinho
                        </button>
                    </div>
                `;

                container.appendChild(productCard);
            });
        }

        // Função para configurar filtros
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');

            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderProducts(btn.dataset.filter);
                });
            });
        }

        // Inicialização da página
        document.addEventListener('DOMContentLoaded', () => {
            updateCartCount();
            renderProducts();
            setupFilters();
        });
    </script>

    <script src="js/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
